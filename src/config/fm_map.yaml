# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in
# docs/failure_taxonomy.md. Every mechanism maps to an existing FM; trace evidence from the v2 run
# is in the taxonomy (section "Bằng chứng v2").
ticket_over_db: FM-03         # ticket facts / "[SYSTEM]" instructions override the DB
stale_policy: FM-06           # superseded or not-yet-effective clause cited in the ticket
clause_sum: FM-04             # sum every clause instead of taking the applicable maximum
double_deduct: FM-05          # agent subtracts a prior refund that the host subtracts again
sibling_refund: FM-07         # batch request: money written under sibling claims
denied_ignored: FM-02         # expired approval / already refunded: host denies, agent says resolved
reply_ledger_mismatch: FM-08  # approval caps below the quote: the reply must state the ledger amount
cross_principal: FM-09        # another principal's order or PII, impersonation
